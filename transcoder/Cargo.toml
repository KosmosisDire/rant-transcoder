[package]
name = "rant-transcoder"
version = "0.0.1"
edition = "2024"
description = "Republishes the video on this host's Rant nodes as H264 any viewer can play"
publish = false

[[bin]]
name = "rant-transcoder"
path = "src/main.rs"

[dependencies]
rant = { package = "rant-middleware", git = "https://github.com/KosmosisDire/Rant.git", tag = "crate-v0.0.32" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
if-addrs = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# only to look for libva before FFmpeg's VAAPI calls abort on its absence
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9"

[build-dependencies]
sha2 = "0.10"
